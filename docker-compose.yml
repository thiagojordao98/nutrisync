version: '3.8'

services:
  database_server: # Mudamos o nome de 'db' para evitar conflitos de DNS
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${USER_DB}
      POSTGRES_PASSWORD: ${PASSWORD_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_DB} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  web:
    build: .
    # O entrypoint garante que o Django ESPERE o DNS propagar
    entrypoint: >
      sh -c "until getent hosts database_server; do 
               echo 'Aguardando rede do banco...'; 
               sleep 2; 
             done; 
             python manage.py migrate && 
             python manage.py runserver 0.0.0.0:8000"
    environment:
      - DEBUG=1
      # IMPORTANTE: O host na URL agora deve ser 'database_server'
      - DATABASE_URL=postgres://${USER_DB}:${PASSWORD_DB}@database_server:5432/${POSTGRES_DB}
    depends_on:
      database_server:
        condition: service_healthy

volumes:
  postgres_data:
